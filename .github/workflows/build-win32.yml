
name: Build Shinhan Native Win32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Windows EXE
        run: msbuild ShinhanNativeTrader.csproj /t:Rebuild /p:Configuration=Release /p:PlatformTarget=x86

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: ShinhanNativeTrader-Win32
          path: bin/Release/ShinhanNativeTrader.exe
