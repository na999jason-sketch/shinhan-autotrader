
name: Build Shinhan AutoTrader Win32

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: 'x86'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run tests
        run: |
          python -m py_compile engine.py indi_client.py app.py
          python -m unittest discover -s tests -v
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name ShinhanAutoTrader_v03 --hidden-import PyQt5.QAxContainer app.py
      - uses: actions/upload-artifact@v4
        with:
          name: ShinhanAutoTrader-v03-Win32
          path: dist/ShinhanAutoTrader_v03.exe
